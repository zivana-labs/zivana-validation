name: orcfax-schema CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "orcfax-schema/**"
      - ".github/workflows/orcfax-schema-ci.yml"
  pull_request:
    paths:
      - "orcfax-schema/**"
      - ".github/workflows/orcfax-schema-ci.yml"

jobs:
  aiken:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orcfax-schema/onchain
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.22
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orcfax-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: orcfax-schema/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
